// Gradle init script generated by mutant-killer.
// Applies the gradle-pitest-plugin to every Java project that does not already use it, and
// honours -PmkTargetClasses / -PmkTargetTests so a run can be scoped to one class.
initscript {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
    dependencies {
        classpath 'info.solidsoft.gradle.pitest:gradle-pitest-plugin:@PLUGIN_VERSION@'
    }
}

// Quality gates and report finalizers are irrelevant to a scratch build and often need extra
// downloads; turn them off wherever they exist.
def skippedTasks = ['jacocoTestReport', 'jacocoTestCoverageVerification', 'checkstyleMain', 'checkstyleTest',
    'spotbugsMain', 'spotbugsTest', 'pmdMain', 'pmdTest', 'javadoc', 'spotlessCheck', 'spotlessJavaCheck',
    'errorproneMain', 'forbiddenApisMain', 'forbiddenApisTest', 'animalsnifferMain', 'animalsnifferTest',
    'licenseMain', 'licenseTest', 'rat', 'japicmp', 'cyclonedxBom'] as Set

allprojects { project ->
    project.tasks.configureEach { task ->
        if (task.name in skippedTasks) {
            task.enabled = false
        }
    }
    project.plugins.withId('java') {
        if (!project.plugins.hasPlugin('info.solidsoft.pitest')) {
            project.apply plugin: info.solidsoft.gradle.pitest.PitestPlugin
            def ext = project.extensions.getByName('pitest')
            ext.pitestVersion = '@PIT_VERSION@'
            def junit5 = '@JUNIT5_PLUGIN_VERSION@'
            if (junit5) {
                ext.junit5PluginVersion = junit5
            }
            ext.threads = @THREADS@
            ext.failWhenNoMutations = false
        }
        project.plugins.withId('info.solidsoft.pitest') {
            def ext = project.extensions.getByName('pitest')
            ext.outputFormats = ['XML']
            ext.timestampedReports = false
            if (project.hasProperty('mkTargetClasses')) {
                ext.targetClasses = project.property('mkTargetClasses').toString().split(',').toList()
            }
            if (project.hasProperty('mkTargetTests')) {
                ext.targetTests = project.property('mkTargetTests').toString().split(',').toList()
            }
        }
    }
}
